{% extends "bare.html" %}
{% block title %}로그인{% endblock %}
{% block bodyclass %}login-page{% endblock %}
{% block content %}
<div class="login-box">
  <img src="{{ url_for('static', filename='img/hanexpress.png') }}" alt="{{ setting('company') }}" class="logo">
  <h1>{{ setting('shipper_name') }} 수주·배송 포털</h1>
  <p class="muted">{{ setting('company') }} {{ setting('team') }} · 운영 실행 플랫폼</p>
  <form method="post" class="stack">
    <label>아이디 <input name="login_id" autocomplete="username" required autofocus></label>
    <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary big">로그인</button>
  </form>
  <p class="muted small" style="margin:18px 0 0">기사는 배차 담당자에게 받은 링크로 접속합니다. 링크가 없으면 <a href="{{ url_for('driver.login') }}">차량번호로 들어가기</a></p>
</div>
{% endblock %}
